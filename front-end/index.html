<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/style.css" />
    <title>RAG AI</title>
  </head>

  <body>
    <div class="chat-container">

      <header class="chat-header">
        <div class="logo">AI</div>

        <div class="header-info">
          <h1>RAG Assistant</h1>
          <span>Ollama · FastAPI · LangChain</span>
        </div>

        <div class="status">
          <div class="status-dot"></div>
          Online
        </div>
      </header>

      <!-- CHAT -->

      <main id="chat-messages">
        <div class="message bot-message">
          Olá! 👋<br />
          Faça uma pergunta sobre os documentos disponíveis no meu conhecimento.
        </div>
      </main>

      <!-- INPUT -->

      <footer class="input-area">
        <div class="input-container">
          <input
            id="user-input"
            type="text"
            placeholder="Digite sua pergunta..."
            autocomplete="off"
            onkeypress="handleKeyPress(event)"
          />

          <button id="send-button" onclick="sendMessage()">➤</button>
        </div>

        <div class="input-footer">Respostas geradas pelo seu RAG local</div>
      </footer>
    </div>

    <script src="/assets/main.js"></script>
    
  </body>
</html>
