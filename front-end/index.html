<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>RAG</title>
</head>
<body>
    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const question = inputField.value.trim();

            if (!question) return;

            // Exibe a mensagem do usuário no chat
            appendMessage(question, 'user-message');
            inputField.value = '';

            // Mensagem temporária de "carregando"
            const loadingId = appendMessage('Pensando...', 'bot-message loading');

            try {
                // Chamada à API da LangServe (/invoke)
                const response = await fetch('http://localhost:8000/invoke', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        input: question
                    })
                });

                const data = await response.json();

                // Remove mensagem de carregamento e exibe a resposta da IA
                document.getElementById(loadingId).remove();
                appendMessage(data.output, 'bot-message');

            } catch (error) {
                console.error('Erro na requisição:', error);
                document.getElementById(loadingId).remove();
                appendMessage('Erro ao obter resposta do servidor.', 'bot-message');
            }
        }

        function appendMessage(text, className) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            const messageId = 'msg-' + Date.now();
            
            messageDiv.id = messageId;
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return messageId;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
